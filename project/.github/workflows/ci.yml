name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check . --ignore PLR0913,PLR2004
      - name: Bootstrap light
        run: python scripts/bootstrap.py --force
        env:
          TWIN_LIGHT_SEED: "true"
      - name: Validate
        run: python scripts/validate.py
      - name: Tests
        run: pytest -q
