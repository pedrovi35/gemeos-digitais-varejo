[project]
name = "retail-digital-twin"
version = "1.0.0"
description = "Enterprise Digital Twin Platform for Retail Supply Chain — Stockout Observability & Operational Simulation"
authors = [{ name = "Supply Chain Engineering" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
keywords = ["digital-twin", "supply-chain", "retail", "stockout", "observability", "simulation"]

dependencies = [
    "streamlit>=1.36.0",
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "plotly>=5.22.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "groq>=0.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "orjson>=3.10.0",
    "simpy>=4.1.1",
    "networkx>=3.3",
    "faker>=25.0.0",
    "streamlit-extras>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", ".streamlit"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
